[project]
name = "agent-fabric-example-py"
version = "0.1.0"
description = "The Python reference agent of the Synadia Agent Fabric."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
# The four packages come from PyPI. To run this agent on their checkouts
# instead, when you work on them: `make test-py CHECKOUTS=1` (or `agent-py`)
# in reference-agents/, which leaves this file and uv.lock as they are.
dependencies = [
  "synadia-ai-agents>=0.8.1",
  "synadia-ai-agent-service>=0.5.0",
  # The fabric package: tracing, on the two SDK packages' hooks.
  "synadia-ai-agent-fabric>=0.3.0",
  # The thin durable SDK: the workflows behind ``start_workflow``
  # (``AGENT_DURABLE=1``).
  "synadia-durable>=0.2.0",
  "nats-py>=2.7",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "jsonschema>=4.23",
  "nkeys>=0.2",
]

# Not a package to build: modules run in place (`uv run python -m fabric_agent`).
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
