name: Python package release

on:
  pull_request:
    paths: ["scripts/python-release.py", "scripts/tests/test_python_release.py", ".github/workflows/release-python.yml"]
  push:
    tags: ["python-v*"]

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.26"

jobs:
  source:
    name: Python source suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: agent-fabric-sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: synadia-ai/synadia-agents
          ref: 8eee29f8c55dba154470386ce43c84bc729b57f3
          path: synadia-agents
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install verified test broker
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://github.com/nats-io/nats-server/releases/download/v2.12.7/nats-server-v2.12.7-linux-amd64.tar.gz
          echo '570d2d627db111e679cc1e6bc57ba78f373ed1769acd8dc9c21c8f62d15b3c52  nats-server-v2.12.7-linux-amd64.tar.gz' | sha256sum --check --strict
          tar xzf nats-server-v2.12.7-linux-amd64.tar.gz
          sudo install -m 0755 nats-server-v2.12.7-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - name: Build TypeScript counterparts for parity and interop
        run: |
          cd synadia-agents/client-sdk/typescript
          bun install --frozen-lockfile
          bun run build
          cd ../../agent-sdk/typescript
          bun install --frozen-lockfile
          bun run build
          cd ../../../agent-fabric-sdk/typescript
          npm ci --no-audit --no-fund
          npm run build
      - name: Run the Python package suite
        working-directory: agent-fabric-sdk/python
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -v

  build:
    name: Build and inspect distributions
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Test publication controls
        run: python3 -m unittest discover -s scripts/tests -p test_python_release.py -v
      - name: Build exact committed source once
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "python-v$version" ]; then
            echo "::error::version tag differs from source"
            exit 1
          fi
          python3 scripts/python-release.py build --version "$version" --artifacts "$RUNNER_TEMP/python-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-release-${{ github.sha }}
          path: ${{ runner.temp }}/python-artifacts/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Install downloaded wheel and sdist
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release-${{ github.sha }}
          path: ${{ runner.temp }}/python-artifacts
      - run: python3 scripts/python-release.py verify --version "${GITHUB_REF_NAME#python-v}" --artifacts "$RUNNER_TEMP/python-artifacts" --install

  publish:
    name: Publish verified bytes to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release-${{ github.sha }}
          path: release-artifacts
      - name: Verify exact downloaded distributions
        run: |
          python3 scripts/python-release.py verify --version "${GITHUB_REF_NAME#python-v}" --artifacts release-artifacts
          mkdir dist
          cp release-artifacts/*.whl release-artifacts/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
