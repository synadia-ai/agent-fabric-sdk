[project]
name = "synadia-ai-agent-fabric"
version = "0.1.0"
description = "The SDK for agents on the Synadia Agent Fabric — tracing and the agent tools' ScratchPad extension, on the hooks of the Synadia Agent Protocol SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Synadia" }]
keywords = ["nats", "agents", "ai", "sdk", "tracing", "agent-fabric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # The protocol SDK: the prompt interceptors, the envelope's extras, the
    # signed publish with a caller-chosen nonce (client) …
    "synadia-ai-agents>=0.8",
    # … and the request interceptors and heartbeat extras (host).
    "synadia-ai-agent-service>=0.5",
]

[project.urls]
Homepage = "https://github.com/synadia-ai/agent-fabric-sdk/tree/main/python"
Repository = "https://github.com/synadia-ai/agent-fabric-sdk"
Issues = "https://github.com/synadia-ai/agent-fabric-sdk/issues"

[tool.uv.sources]
# During development the protocol SDK resolves to the synadia-agents
# checkout next to this repo, on branch `sdk-release-rollout`, where the hooks
# live. This is dev-time config only — it is not persisted into the built
# wheel, which declares the published packages above. Switch to them once
# they are out.
synadia-ai-agents = { path = "../../synadia-agents/client-sdk/python", editable = true }
synadia-ai-agent-service = { path = "../../synadia-agents/agent-sdk/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # The edge record's contract, `test-fixtures/schemas/edge.json`.
    "jsonschema>=4.21",
    "types-jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synadia_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = [
    # build_edge_record and build_served_record take the record's fields
    # positionally, the same signatures as the TypeScript package's builders.
    "PLR0913",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic values in tests are fine

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
packages = ["synadia_ai.agent_fabric"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "nats.*"
ignore_missing_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = "nkeys"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    # nats-py's own `datetime.utcnow()`; nothing this package can change.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
